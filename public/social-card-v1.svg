<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627" role="img" aria-labelledby="title desc">
  <title id="title">algonow: algorithms paired with heuristics</title>
  <desc id="desc">A dark technical card pairing blue algorithms with amber heuristics and a green solved path.</desc>
  <defs>
    <radialGradient id="blueGlow" cx="0" cy="0" r="1" gradientTransform="translate(1050 20) rotate(132) scale(600 430)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5da2ff" stop-opacity=".14"/>
      <stop offset="1" stop-color="#5da2ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amberGlow" cx="0" cy="0" r="1" gradientTransform="translate(1140 610) rotate(-150) scale(510 330)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f0b94b" stop-opacity=".11"/>
      <stop offset="1" stop-color="#f0b94b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M38 0H0V38" fill="none" stroke="#232c40" stroke-opacity=".34"/>
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#f0b94b"/>
    </marker>
  </defs>

  <rect width="1200" height="627" fill="#0a0d13"/>
  <rect width="1200" height="627" fill="url(#grid)"/>
  <rect width="1200" height="627" fill="url(#blueGlow)"/>
  <rect width="1200" height="627" fill="url(#amberGlow)"/>
  <rect x="22" y="22" width="1156" height="583" rx="24" fill="none" stroke="#232c40" stroke-width="2"/>

  <g font-family="Cascadia Code, Consolas, Menlo, monospace">
    <text x="68" y="92" font-size="42" font-weight="700" letter-spacing="-2">
      <tspan fill="#5da2ff">algo</tspan><tspan fill="#e9edf6">now</tspan><tspan fill="#f0b94b">.net</tspan>
    </text>
    <text x="68" y="151" fill="#9aa5bd" font-size="18" font-weight="700" letter-spacing="3">LEARN THE PAIR, NOT THE NAME</text>

    <text x="66" y="257" fill="#5da2ff" font-size="72" font-weight="700" letter-spacing="-4">algorithms</text>
    <text x="74" y="296" fill="#9aa5bd" font-size="20">the control structure</text>

    <text x="66" y="391" fill="#f0b94b" font-size="72" font-weight="700" letter-spacing="-4">heuristics</text>
    <text x="74" y="430" fill="#9aa5bd" font-size="20">the guiding rule</text>

    <g transform="translate(70 489)" font-size="17" font-weight="700">
