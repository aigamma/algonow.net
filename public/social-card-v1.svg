      <rect x="194" width="154" height="45" rx="22.5" fill="#111622" stroke="#745c29"/>
      <text x="271" y="29" text-anchor="middle" fill="#f7d68d">tested Python</text>
      <rect x="364" width="169" height="45" rx="22.5" fill="#111622" stroke="#2e6c47"/>
      <text x="448.5" y="29" text-anchor="middle" fill="#b7f3ca">spoken lessons</text>
    </g>

    <text x="68" y="577" fill="#6b7690" font-size="18" letter-spacing="2">ALGONOW.NET</text>
