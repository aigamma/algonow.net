    <path d="M222 166V223H320" fill="none" stroke="#62d98a" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M222 166V223H320" fill="none" stroke="#62d98a" stroke-opacity=".2" stroke-width="26" stroke-linecap="round" filter="url(#softGlow)"/>

