<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="pack-title pack-desc" font-family="ui-monospace, Menlo, Consolas, monospace">
<title id="pack-title">Five runbook blocks packed into four chunks under a 200-character budget</title>
<desc id="pack-desc">Each input block on the left is drawn to scale against the budget; each chunk on the right shows how much of the 200-character budget its text uses. The label on each connector is the decision the loop made for that block. The oversized incident block at the bottom is rejected.</desc>
<rect width="900" height="470" fill="#161d2c"/>
<text x="28" y="34" fill="#e9edf6" font-size="13">Five blocks in, four chunks out: budget 200 characters per chunk text (heading, newline, body)</text>
<text x="28" y="58" fill="#9aa5bd" font-size="11">input blocks (text length, drawn to the same scale)</text>
<text x="590" y="58" fill="#9aa5bd" font-size="11">chunks (text length out of 200)</text>
<rect x="28" y="72" width="250" height="28" rx="3" fill="#1e2740" stroke="#232c40"/>
<rect x="28" y="72" width="121.2" height="28" rx="3" fill="#5da2ff" opacity="0.28"/>
<text x="36" y="85" fill="#e9edf6" font-size="11.5">block 1  API keys</text>
<text x="36" y="97" fill="#9aa5bd" font-size="10.5">97 chars, 106 with heading</text>
<rect x="28" y="134" width="250" height="28" rx="3" fill="#1e2740" stroke="#232c40"/>
<rect x="28" y="134" width="76.2" height="28" rx="3" fill="#5da2ff" opacity="0.28"/>
<text x="36" y="147" fill="#e9edf6" font-size="11.5">block 2  Rotate a key</text>
<text x="36" y="159" fill="#9aa5bd" font-size="10.5">61 chars, 74 with heading</text>
<rect x="28" y="196" width="250" height="28" rx="3" fill="#1e2740" stroke="#232c40"/>
<rect x="28" y="196" width="148.8" height="28" rx="3" fill="#5da2ff" opacity="0.28"/>
<text x="36" y="209" fill="#e9edf6" font-size="11.5">block 3  Rotate a key</text>
<text x="36" y="221" fill="#9aa5bd" font-size="10.5">119 chars, 132 with heading</text>
<rect x="28" y="258" width="250" height="28" rx="3" fill="#1e2740" stroke="#232c40"/>
<rect x="28" y="258" width="121.2" height="28" rx="3" fill="#5da2ff" opacity="0.28"/>
<text x="36" y="271" fill="#e9edf6" font-size="11.5">block 4  Rotate a key</text>
<text x="36" y="283" fill="#9aa5bd" font-size="10.5">97 chars, 110 with heading</text>
<rect x="28" y="320" width="250" height="28" rx="3" fill="#1e2740" stroke="#232c40"/>
<rect x="28" y="320" width="101.2" height="28" rx="3" fill="#5da2ff" opacity="0.28"/>
<text x="36" y="333" fill="#e9edf6" font-size="11.5">block 5  Scopes</text>
<text x="36" y="345" fill="#9aa5bd" font-size="10.5">81 chars, 88 with heading</text>
<rect x="590" y="72" width="280" height="28" rx="3" fill="#1e2740" stroke="#232c40"/>
<rect x="590" y="72" width="148.4" height="28" rx="3" fill="#62d98a" opacity="0.32"/>
<text x="598" y="85" fill="#e9edf6" font-size="11.5">chunk 1  API keys</text>
<text x="598" y="97" fill="#9aa5bd" font-size="10.5">106 of 200 characters</text>
<rect x="590" y="165.0" width="280" height="28" rx="3" fill="#1e2740" stroke="#232c40"/>
<rect x="590" y="165.0" width="273.0" height="28" rx="3" fill="#62d98a" opacity="0.32"/>
<text x="598" y="178.0" fill="#e9edf6" font-size="11.5">chunk 2  Rotate a key</text>
<text x="598" y="190.0" fill="#9aa5bd" font-size="10.5">195 of 200 characters</text>
<rect x="590" y="258" width="280" height="28" rx="3" fill="#1e2740" stroke="#232c40"/>
<rect x="590" y="258" width="154.0" height="28" rx="3" fill="#62d98a" opacity="0.32"/>
<text x="598" y="271" fill="#e9edf6" font-size="11.5">chunk 3  Rotate a key</text>
<text x="598" y="283" fill="#9aa5bd" font-size="10.5">110 of 200 characters</text>
<rect x="590" y="320" width="280" height="28" rx="3" fill="#1e2740" stroke="#232c40"/>
<rect x="590" y="320" width="123.2" height="28" rx="3" fill="#62d98a" opacity="0.32"/>
<text x="598" y="333" fill="#e9edf6" font-size="11.5">chunk 4  Scopes</text>
<text x="598" y="345" fill="#9aa5bd" font-size="10.5">88 of 200 characters</text>
<line x1="870" y1="64" x2="870" y2="356" stroke="#f0b94b" stroke-dasharray="3 3"/>
<text x="870" y="370" fill="#f0b94b" font-size="10.5" text-anchor="end">budget 200</text>
<line x1="284" y1="86" x2="584" y2="86" stroke="#5da2ff" stroke-width="1.4"/>
<circle cx="584" cy="86" r="3" fill="#5da2ff"/>
<text x="434.0" y="78.0" fill="#5da2ff" font-size="10.5" text-anchor="middle">first block: open chunk 1</text>
<line x1="284" y1="148" x2="584" y2="179.0" stroke="#5da2ff" stroke-width="1.4"/>
<circle cx="584" cy="179.0" r="3" fill="#5da2ff"/>
<text x="434.0" y="155.5" fill="#5da2ff" font-size="10.5" text-anchor="middle">heading changed: open chunk 2</text>
<line x1="284" y1="210" x2="584" y2="179.0" stroke="#62d98a" stroke-width="1.4"/>
<circle cx="584" cy="179.0" r="3" fill="#62d98a"/>
<text x="434.0" y="186.5" fill="#62d98a" font-size="10.5" text-anchor="middle">same heading, 74 + 2 + 119 = 195 ≤ 200: join</text>
<line x1="284" y1="272" x2="584" y2="272" stroke="#f0b94b" stroke-width="1.4"/>
<circle cx="584" cy="272" r="3" fill="#f0b94b"/>
<text x="434.0" y="264.0" fill="#f0b94b" font-size="10.5" text-anchor="middle">same heading, 195 + 2 + 97 = 294 > 200: open chunk 3</text>
<line x1="284" y1="334" x2="584" y2="334" stroke="#5da2ff" stroke-width="1.4"/>
<circle cx="584" cy="334" r="3" fill="#5da2ff"/>
<text x="434.0" y="326.0" fill="#5da2ff" font-size="10.5" text-anchor="middle">heading changed (193 would fit by size): open chunk 4</text>
<rect x="28" y="392" width="500" height="28" rx="3" fill="#1e2740" stroke="#e06767"/>
<rect x="28" y="392" width="333.8" height="28" rx="3" fill="#e06767" opacity="0.3"/>
<text x="36" y="405" fill="#e9edf6" font-size="11.5">block 6  Incident call  (five numbered steps)</text>
<text x="36" y="417" fill="#9aa5bd" font-size="10.5">267 chars, 281 with heading</text>
<text x="540" y="405" fill="#e06767" font-size="11">281 > 200: ValueError, rejected</text>
<text x="540" y="418" fill="#9aa5bd" font-size="10.5">the practice variation splits it at its line breaks</text>
</svg>
