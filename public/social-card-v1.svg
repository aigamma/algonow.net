      <rect x="34" y="326" width="139" height="37" rx="18.5" fill="#101c2e" stroke="#2b5fa8"/>
      <text x="103.5" y="350" text-anchor="middle" fill="#5da2ff">ALGORITHM</text>
      <rect x="188" y="326" width="145" height="37" rx="18.5" fill="#201b12" stroke="#745c29"/>
